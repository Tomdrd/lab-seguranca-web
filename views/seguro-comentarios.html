<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Comentários - SEGURA</title>
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/comentarios.css">
</head>
<body>

  <button class="theme-toggle" id="themeBtn" aria-label="Alternar tema">
    <i data-lucide="moon" id="themeIcon"></i>
    <span id="themeLabel">Claro</span>
  </button>

  <div class="container narrow">

    <a class="back-link" href="/"><i data-lucide="arrow-left"></i> Voltar ao laboratório</a>

    <header class="header">
      <div class="badge">
        <i data-lucide="shield-check"></i>
        XSS · versão segura
      </div>
      <h1>Comentários <span class="glow">SEGURA</span></h1>
      <p>textContent + CSP</p>
    </header>

    <div class="login-panel">
      <div class="field">
        <label for="texto">Novo comentário</label>
        <textarea id="texto" rows="3" placeholder="Escreva um comentário..."></textarea>
      </div>

      <div class="btn-group single">
        <button class="btn btn-green btn-full" id="btnEnviar">
          <span>Publicar</span>
          <span class="btn-label">textContent + CSP</span>
        </button>
      </div>

      <div class="hint-box">
        <i data-lucide="lightbulb"></i>
        <div>
          <strong>Dica de ataque</strong>
          Comente <code>&lt;img src=x onerror="alert('XSS')"&gt;</code>. Na versão vulnerável o navegador executa o script; nesta página, ele aparece como texto.
        </div>
      </div>

      <p class="lista-titulo">Comentários publicados</p>
      <div id="lista"></div>
    </div>

  </div>

  <script src="/scripts/lucide.min.js"></script>
  <script src="/scripts/theme.js"></script>
  <script src="/scripts/seguro-comentarios.js"></script>
</body>
</html>
