<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Força Bruta</title>
<style>
 body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
 button { padding: 10px 16px; margin: 6px 6px 6px 0; border: none; color: #fff; cursor: pointer; }
 .btn-vul { background:#f97316; }
 .btn-seg { background:#16a34a; }
 #log { background:#111; color:#0f0; font-family:monospace; font-size:0.85rem; padding:15px; margin-top:15px; height:260px; overflow-y:auto; white-space:pre-wrap; }
</style>
</head>
<body>
<h2>Demo: Ataque de Força Bruta</h2>
<p>Alvo: <strong>tom@empresa.com</strong> (o navegador vai tentar várias senhas em sequência).</p>
<button class="btn-vul" onclick="atacar('/vulneravel-forca-bruta/login')">Atacar versão VULNERÁVEL</button>
<button class="btn-seg" onclick="atacar('/seguro-forca-bruta/login')">Atacar versão SEGURA (com rate limit)</button>
<div id="log"></div>
<p><a href="/">← voltar</a></p>
<script>
const senhas = ['123123', 'qwerty', 'senha123', '123456', '000000'];
const log = document.getElementById('log');

function escrever(linha) {
  log.textContent += linha + '\n';
  log.scrollTop = log.scrollHeight;
}

async function atacar(rota) {
  log.textContent = '';
  escrever(`Iniciando ataque contra ${rota}...\n`);
  for (const senha of senhas) {
    const r = await fetch(rota, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: 'tom@empresa.com', senha })
    });
    const d = await r.json();
    if (r.status === 429) {
      escrever(`Tentativa "${senha}" -> BLOQUEADO (429): ${d.mensagem}`);
      escrever('\nAtaque interrompido pelo rate limiting. A senha correta nem chegou a ser testada!');
      return;
    }
    if (r.status === 200) {
      escrever(`Tentativa "${senha}" -> SUCESSO! ${d.mensagem}`);
      escrever('\nSenha descoberta por força bruta.');
      return;
    }
    escrever(`Tentativa "${senha}" -> falhou`);
    await new Promise(res => setTimeout(res, 300));
  }
  escrever('\nLista de senhas esgotada, nenhuma funcionou.');
}
</script>
</body>
</html>
