<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>JWT</title>
<style>
 body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
 input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
 button { background:#16a34a; color:#fff; border:none; cursor:pointer; }
 pre { background:#111; color:#0f0; padding:15px; overflow-x:auto; font-size:0.8rem; white-space:pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h2>Demo: API protegida com JWT</h2>
<input id="email" value="tom@empresa.com" placeholder="E-mail">
<input id="senha" type="password" value="123456" placeholder="Senha">
<button onclick="login()">Fazer login e obter token</button>
<p>Token atual:</p>
<pre id="token">(nenhum ainda)</pre>

<button onclick="acessarSemToken()">Acessar /api/perfil SEM token</button>
<button onclick="acessarComToken()">Acessar /api/perfil COM token</button>
<pre id="resultado"></pre>
<p><a href="/">← voltar</a></p>
<script>
let token = null;

async function login() {
  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;
  const r = await fetch('/api/jwt/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, senha })
  });
  const d = await r.json();
  if (d.ok) {
    token = d.token;
    document.getElementById('token').textContent = token;
  } else {
    document.getElementById('token').textContent = 'Falha no login: ' + d.mensagem;
  }
}

async function acessarSemToken() {
  const r = await fetch('/api/perfil');
  const d = await r.json();
  document.getElementById('resultado').textContent = `Status ${r.status}: ${JSON.stringify(d)}`;
}

async function acessarComToken() {
  const r = await fetch('/api/perfil', {
    headers: { Authorization: 'Bearer ' + token }
  });
  const d = await r.json();
  document.getElementById('resultado').textContent = `Status ${r.status}: ${JSON.stringify(d)}`;
}
</script>
</body>
</html>
