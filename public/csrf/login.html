<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CSRF - Login</title>
<style>
 body { font-family: sans-serif; max-width: 420px; margin: 50px auto; }
 button { width:100%; padding:12px; background:#f97316; color:#fff; border:none; cursor:pointer; margin-top:10px; }
 p { color:#444; }
</style>
</head>
<body>
<h2>Demo CSRF - Login</h2>
<p>Clique para simular que você já está logado no sistema (como <strong>tom@empresa.com</strong>). Isso cria uma sessão de verdade, com cookie.</p>
<button onclick="login()">Entrar</button>
<p id="status"></p>
<hr>
<p><a href="/csrf/conta-vulneravel.html">→ Minha Conta (versão VULNERÁVEL)</a></p>
<p><a href="/csrf/conta-segura.html">→ Minha Conta (versão SEGURA)</a></p>
<script>
async function login() {
  const r = await fetch('/csrf/login', { method: 'POST' });
  const d = await r.json();
  document.getElementById('status').textContent = d.ok ? 'Logado! Agora acesse "Minha Conta".' : 'Erro ao logar';
}
</script>
</body>
</html>
