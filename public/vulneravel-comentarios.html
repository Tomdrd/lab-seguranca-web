<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Comentários - VULNERÁVEL</title>
<style>
 body { font-family: sans-serif; max-width: 500px; margin: 50px auto; }
 textarea, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
 button { background: #f97316; color: white; border: none; cursor: pointer; }
 #lista { margin-top: 20px; border-top: 1px solid #ddd; padding-top: 10px; }
 .comentario { padding: 8px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<h2>Comentários (versão VULNERÁVEL)</h2>
<textarea id="texto" rows="3" placeholder="Escreva um comentário..."></textarea>
<button onclick="enviar()">Publicar</button>
<div id="lista"></div>

<script>
async function carregar() {
  const r = await fetch('/api/comentarios');
  const comentarios = await r.json();
  const lista = document.getElementById('lista');
  // PERIGO: innerHTML interpreta o comentário como HTML/JS de verdade
  lista.innerHTML = comentarios.map(c => `<div class="comentario">${c}</div>`).join('');
}

async function enviar() {
  const texto = document.getElementById('texto').value;
  await fetch('/api/comentarios', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ texto })
  });
  document.getElementById('texto').value = '';
  carregar();
}

carregar();
</script>
</body>
</html>
